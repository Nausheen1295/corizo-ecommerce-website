<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Tech World</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
</head>
<body>
  <nav id="siteNav" class="navbar"></nav>

  <main class="container py-4 py-lg-5">
    <h1 class="section-title mb-4">Checkout</h1>

    <div id="statusMessage" class="alert" role="status"></div>

    <div class="row g-4">
      <div class="col-lg-7">
        <form id="checkoutForm" class="panel" novalidate>
          <h2 class="h5 fw-bold mb-3">Shipping address</h2>

          <div class="row g-3">
            <div class="col-md-6">
              <label for="fullName" class="form-label">Full name</label>
              <input id="fullName" class="form-control" autocomplete="name" required>
            </div>
            <div class="col-md-6">
              <label for="phone" class="form-label">Phone</label>
              <input id="phone" type="tel" class="form-control" autocomplete="tel" required>
            </div>
            <div class="col-12">
              <label for="addressLine" class="form-label">Address</label>
              <textarea id="addressLine" class="form-control" rows="2"
                        autocomplete="street-address" required></textarea>
            </div>
            <div class="col-md-6">
              <label for="city" class="form-label">City</label>
              <input id="city" class="form-control" autocomplete="address-level2" required>
            </div>
            <div class="col-md-6">
              <label for="postalCode" class="form-label">
                Postal code <span class="text-secondary">(optional)</span>
              </label>
              <input id="postalCode" class="form-control" autocomplete="postal-code">
            </div>
          </div>

          <h2 class="h5 fw-bold mt-4 mb-3">Payment</h2>
          <div class="form-check border rounded p-3 ps-5">
            <input class="form-check-input" type="radio" id="cod" checked disabled>
            <label class="form-check-label" for="cod">
              <strong>Cash on delivery</strong><br>
              <span class="text-secondary small">Pay when your order arrives.</span>
            </label>
          </div>

          <button id="placeOrderButton" type="submit" class="btn btn-brand btn-lg w-100 mt-4" disabled>
            Place order
          </button>
        </form>
      </div>

      <div class="col-lg-5">
        <div class="panel">
          <h2 class="h5 fw-bold mb-3">Your order</h2>
          <div id="orderSummary">Loading...</div>
          <hr>
          <div class="d-flex justify-content-between">
            <strong>Total</strong>
            <strong id="orderTotal" class="price">₹0.00</strong>
          </div>
          <a href="/cart.html" class="btn btn-light w-100 mt-3">Edit cart</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-4 mt-5">
    <div class="container d-flex flex-wrap justify-content-between gap-2">
      <span><strong>Tech World</strong> — Nausheen's e-commerce project</span>
      <span>Built with HTML, Bootstrap, Node.js and MongoDB</span>
    </div>
  </footer>

  <script src="/common.js"></script>
  <script>
    const form = document.getElementById("checkoutForm");
    const placeOrderButton = document.getElementById("placeOrderButton");
    const fields = ["fullName", "phone", "addressLine", "city", "postalCode"];

    async function loadSummary() {
      try {
        const cart = await api("/api/cart");

        if (cart.notice) {
          showMessage(cart.notice, "warning");
        }

        if (!cart.items.length) {
          document.getElementById("orderSummary").innerHTML =
            '<p class="text-secondary mb-0">Your cart is empty. ' +
            '<a href="/#products">Browse products</a></p>';
          return;
        }

        document.getElementById("orderSummary").innerHTML = cart.items.map(item => `
          <div class="d-flex justify-content-between gap-3 mb-2">
            <span>${escapeHtml(item.name)} × ${item.quantity}</span>
            <span class="text-nowrap">${formatPrice(item.subtotal)}</span>
          </div>`
        ).join("");

        document.getElementById("orderTotal").textContent = formatPrice(cart.total);
        placeOrderButton.disabled = false;
      } catch (error) {
        showMessage("Could not load your cart: " + error.message, "danger");
      }
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      hideMessage();

      const shippingAddress = {};

      for (const field of fields) {
        shippingAddress[field] = document.getElementById(field).value.trim();
      }

      if (
        !shippingAddress.fullName ||
        !shippingAddress.phone ||
        !shippingAddress.addressLine ||
        !shippingAddress.city
      ) {
        showMessage("Please fill in your name, phone, address and city.", "warning");
        return;
      }

      placeOrderButton.disabled = true;
      placeOrderButton.textContent = "Placing order...";

      try {
        const result = await api("/api/orders/checkout", {
          method: "POST",
          body: JSON.stringify({ shippingAddress })
        });

        window.location.href = "/myorders.html?placed=" +
          encodeURIComponent(result.order._id);
      } catch (error) {
        showMessage(error.message, "danger");
        placeOrderButton.disabled = false;
        placeOrderButton.textContent = "Place order";
      }
    });

    async function init() {
      const user = await initPage({ requireLogin: true });
      if (!user) return;

      document.getElementById("fullName").value = user.name;
      await loadSummary();
    }

    init();
  </script>
</body>
</html>
