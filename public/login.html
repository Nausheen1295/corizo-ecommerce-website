<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | Corizo Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
</head>
<body>
  <nav id="siteNav" class="navbar"></nav>

  <main class="container py-4 py-lg-5">
    <div class="panel auth-card">
      <h1 class="h3 section-title mb-1">Welcome back</h1>
      <p class="text-secondary">Log in to shop and track your orders.</p>

      <div id="statusMessage" class="alert" role="status"></div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input id="email" type="email" class="form-control" autocomplete="email" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input id="password" type="password" class="form-control"
                 autocomplete="current-password" required>
        </div>
        <button id="submitButton" type="submit" class="btn btn-brand w-100">Log in</button>
      </form>

      <p class="text-center text-secondary mt-3 mb-0">
        New here? <a id="registerLink" href="/register.html">Create an account</a>
      </p>
    </div>
  </main>

  <footer class="py-4 mt-5">
    <div class="container d-flex flex-wrap justify-content-between gap-2">
      <span><strong>Corizo Store</strong> — Student e-commerce project</span>
      <span>Built with HTML, Bootstrap, Node.js and MongoDB</span>
    </div>
  </footer>

  <script src="/common.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const submitButton = document.getElementById("submitButton");

    function pageAfterLogin(user) {
      return safeNextPage(user.role === "admin" ? "/admin.html" : "/");
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      hideMessage();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        showMessage("Please enter your email and password.", "warning");
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Logging in...";

      try {
        const result = await api("/api/auth/login", {
          method: "POST",
          body: JSON.stringify({ email, password })
        });

        window.location.href = pageAfterLogin(result.user);
      } catch (error) {
        showMessage(error.message, "danger");
        submitButton.disabled = false;
        submitButton.textContent = "Log in";
      }
    });

    async function init() {
      const user = await initPage();

      // Already logged in, so there is nothing to do here
      if (user) {
        window.location.href = pageAfterLogin(user);
        return;
      }

      const params = new URLSearchParams(window.location.search);

      if (params.get("registered")) {
        showMessage("Registration successful! You can now log in.", "success");
      }

      // Keep the "next" page when switching to the register form
      if (params.get("next")) {
        document.getElementById("registerLink").href =
          "/register.html?next=" + encodeURIComponent(params.get("next"));
      }
    }

    init();
  </script>
</body>
</html>
