<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders | Corizo Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
</head>
<body>
  <nav id="siteNav" class="navbar"></nav>

  <main class="container py-4 py-lg-5">
    <h1 class="section-title mb-4">My orders</h1>

    <div id="statusMessage" class="alert" role="status"></div>

    <div id="orderList">Loading your orders...</div>
  </main>

  <footer class="py-4 mt-5">
    <div class="container d-flex flex-wrap justify-content-between gap-2">
      <span><strong>Corizo Store</strong> — Student e-commerce project</span>
      <span>Built with HTML, Bootstrap, Node.js and MongoDB</span>
    </div>
  </footer>

  <script src="/common.js"></script>
  <script>
    const orderList = document.getElementById("orderList");

    const STATUS_COLORS = {
      Pending: "warning",
      Confirmed: "info",
      Shipped: "primary",
      Delivered: "success",
      Cancelled: "secondary"
    };

    function shortId(id) {
      return "#" + String(id).slice(-8).toUpperCase();
    }

    function renderOrders(orders) {
      if (!orders.length) {
        orderList.innerHTML = `
          <div class="panel text-center py-5">
            <p class="text-secondary">You haven't placed any orders yet.</p>
            <a href="/#products" class="btn btn-brand">Start shopping</a>
          </div>`;
        return;
      }

      orderList.innerHTML = orders.map(order => {
        const address = order.shippingAddress || {};

        return `
          <div class="panel order-card">
            <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
              <div>
                <div class="fw-bold">Order ${escapeHtml(shortId(order._id))}</div>
                <div class="text-secondary small">Placed on ${formatDate(order.createdAt)}</div>
              </div>
              <div class="d-flex gap-2">
                <span class="badge text-bg-${STATUS_COLORS[order.status] || "secondary"}">
                  ${escapeHtml(order.status)}
                </span>
                <span class="badge text-bg-light border">
                  ${escapeHtml(order.paymentMethod)} · ${escapeHtml(order.paymentStatus)}
                </span>
              </div>
            </div>

            ${order.items.map(item => `
              <div class="d-flex justify-content-between gap-3 mb-1">
                <span>${escapeHtml(item.name)} × ${item.quantity}</span>
                <span class="text-nowrap">${formatPrice(item.price * item.quantity)}</span>
              </div>`
            ).join("")}

            <hr>
            <div class="d-flex flex-wrap justify-content-between gap-3">
              <div class="text-secondary small">
                Delivering to ${escapeHtml(address.fullName)},
                ${escapeHtml(address.addressLine)}, ${escapeHtml(address.city)}
                ${address.postalCode ? " - " + escapeHtml(address.postalCode) : ""}
              </div>
              <div class="fw-bold">Total ${formatPrice(order.totalAmount)}</div>
            </div>
          </div>`;
      }).join("");
    }

    async function init() {
      if (!(await initPage({ requireLogin: true }))) return;

      const placedId = new URLSearchParams(window.location.search).get("placed");

      if (placedId) {
        showMessage(
          `Thank you! Your order ${shortId(placedId)} has been placed. ` +
          "Please keep cash ready for delivery.",
          "success"
        );
      }

      try {
        renderOrders(await api("/api/orders/my-orders"));
      } catch (error) {
        orderList.textContent = "";
        showMessage("Could not load your orders: " + error.message, "danger");
      }
    }

    init();
  </script>
</body>
</html>
