<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Tech World</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
</head>
<body>
  <nav id="siteNav" class="navbar"></nav>

  <main class="container py-4 py-lg-5">
    <div class="panel auth-card">
      <h1 class="h3 section-title mb-1">Create your account</h1>
      <p class="text-secondary">It only takes a minute.</p>

      <div id="statusMessage" class="alert" role="status"></div>

      <form id="registerForm" novalidate>
        <div class="mb-3">
          <label for="name" class="form-label">Full name</label>
          <input id="name" class="form-control" autocomplete="name" maxlength="80" required>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input id="email" type="email" class="form-control" autocomplete="email" required>
        </div>
        <div class="mb-3">
          <label for="phone" class="form-label">
            Phone <span class="text-secondary">(optional)</span>
          </label>
          <input id="phone" type="tel" class="form-control" autocomplete="tel">
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input id="password" type="password" class="form-control"
                 autocomplete="new-password" minlength="8" maxlength="72" required>
          <div class="form-text">At least 8 characters.</div>
        </div>
        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirm password</label>
          <input id="confirmPassword" type="password" class="form-control"
                 autocomplete="new-password" required>
        </div>
        <button id="submitButton" type="submit" class="btn btn-brand w-100">Create account</button>
      </form>

      <p class="text-center text-secondary mt-3 mb-0">
        Already have an account? <a id="loginLink" href="/login.html">Log in</a>
      </p>
    </div>
  </main>

  <footer class="py-4 mt-5">
    <div class="container d-flex flex-wrap justify-content-between gap-2">
      <span><strong>Tech World</strong> — Nausheen's e-commerce project</span>
      <span>Built with HTML, Bootstrap, Node.js and MongoDB</span>
    </div>
  </footer>

  <script src="/common.js"></script>
  <script>
    const form = document.getElementById("registerForm");
    const submitButton = document.getElementById("submitButton");
    const next = new URLSearchParams(window.location.search).get("next");

    form.addEventListener("submit", async event => {
      event.preventDefault();
      hideMessage();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (name.length < 2) {
        showMessage("Please enter your name.", "warning");
        return;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showMessage("Please enter a valid email address.", "warning");
        return;
      }

      if (password.length < 8) {
        showMessage("Password must be at least 8 characters.", "warning");
        return;
      }

      if (password !== confirmPassword) {
        showMessage("The two passwords do not match.", "warning");
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Creating account...";

      try {
        await api("/api/auth/register", {
          method: "POST",
          body: JSON.stringify({ name, email, phone, password })
        });

        window.location.href = "/login.html?registered=1" +
          (next ? "&next=" + encodeURIComponent(next) : "");
      } catch (error) {
        showMessage(error.message, "danger");
        submitButton.disabled = false;
        submitButton.textContent = "Create account";
      }
    });

    async function init() {
      const user = await initPage();

      if (user) {
        window.location.href = "/";
        return;
      }

      if (next) {
        document.getElementById("loginLink").href =
          "/login.html?next=" + encodeURIComponent(next);
      }
    }

    init();
  </script>
</body>
</html>
